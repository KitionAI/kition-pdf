format: 1
id: pdf.agent.recover/broken-link
feature: pdf.agent.recover
intent: >-
  The agent runs the kit's check, finds the link that goes nowhere, and removes or retargets it, leaving the page's text as it was (KHP Verify).
layer: eval
source:
  kind: synthetic
  from: repo:conformance/check-broken-link.pdf
  license: Apache-2.0
  note: "A copy of the conformance fixture for pdf.broken-link (a link to the undefined destination \"summary\"), written by bindings/wasm/examples/checks.rs."
input: [input/summary.pdf]
steps:
  - task:
      prompt: >-
        Run the kit's check on summary.pdf and fix every error it reports. Keep the text on the
        page exactly as it is.
      max_turns: 20
  - check: { path: summary.pdf, as: diagnostics }
  - run: { path: summary.pdf, args: { save: false }, steps: [{ command: text.extract }], as: text }
expected:
  - actual: out:diagnostics
    compare: diagnostics
    value: { absent: [pdf.broken-link], max_errors: 0 }
  - actual: out:text
    compare: values
    collateral: true
    value:
      completed.0.result.pages.0.text: "Quarterly report\nSales rose in every region."
solution:
  - tool: pdf_run
    args: { path: summary.pdf, steps: [{ command: link.delete, params: { page: 1, index: 1 } }] }
since: "2026-11-17"
timeout_s: 600
