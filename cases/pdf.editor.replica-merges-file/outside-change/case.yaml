format: 1
id: pdf.editor.replica-merges-file/outside-change
feature: pdf.editor.replica-merges-file
intent: >-
  Through the development host with a replica store (`?replica=1&replica-merges-file=1`), the editor
  adds a bookmark and a comment and saves; another program appends a bookmark to the saved file, and
  `devHost.reopenChanged` reopens the editor on it with the stored replica. The outside bookmark and the
  edits from before show, the replica id is the same, the replica's history still holds the version from
  before the change with the comment's objects under the same ids, and the replica is still kept. Opening
  the same file alone (`devHost.open`) starts another replica whose history does not hold that version.
  In Chromium and WebKit.
layer: gate
source:
  kind: probe
  from: web/tests/replica.mjs
  license: owned
input: []
steps:
  - exec:
      cmd: [pnpm, --dir, web, exec, node, tests/replica.mjs, chromium]
  - exec:
      cmd: [pnpm, --dir, web, exec, node, tests/replica.mjs, webkit]
expected:
  - actual: out:exec
    compare: exit
    value: 0
requires: [chromium, webkit]
tags: [browser]
timeout_s: 120
since: "2026-11-24"
