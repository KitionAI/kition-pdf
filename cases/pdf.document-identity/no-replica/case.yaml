format: 1
id: pdf.document-identity/no-replica
feature: pdf.document-identity
intent: >-
  Through the real kition-pdf process: a .pdf embeds no replica (the kit makes one under a new id
  each time it opens a file), so document.identity answers no docId for a PDF the kit made and
  edited, or for a byte copy of it; document.fork writes the same bytes to a new file with no
  docId, leaves the source unchanged, and never replaces an existing file. The headless kit lists
  the feature document.identity.
layer: gate
tags: [headless]
source:
  kind: synthetic
  from: bindings/headless/tests/identity.rs (a_pdf_carries_no_identity_and_forks_as_the_same_bytes)
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-pdf, test: identity, filter: a_pdf_carries_no_identity_and_forks_as_the_same_bytes }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-20"
