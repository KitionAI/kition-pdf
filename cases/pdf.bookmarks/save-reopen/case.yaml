format: 1
id: pdf.bookmarks/save-reopen
feature: pdf.bookmarks
intent: >-
  Each bookmark.add on a PDF without an Info dictionary or ID saves incrementally after the original
  bytes, and the reopened copy keeps the document id and version (the save is not read back as an
  import). It does not yet check that the reopened copy lists the bookmark.
layer: unit
source:
  kind: synthetic
  from: bindings/wasm/src/save_tests.rs (search fixture, Type 3 fonts, no Info or ID)
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-pdf-kit, filter: "save_tests::original_type3_without_info_or_id_keeps_version_after_each_bookmark_save" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-17"
