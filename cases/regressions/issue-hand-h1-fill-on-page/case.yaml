format: 1
id: regressions/issue-hand-h1-fill-on-page
feature: pdf.editor.forms-on-page
intent: >-
  A form could not be filled on the page: a click in a text field or on a check box did nothing,
  and the only way was the Fields panel. Now each field has a control where it is on the page: a
  click in a text field and typing fills it as it lets go (Enter, Tab, a press elsewhere), Tab and
  Shift+Tab go through the document's tab order across pages, a drop-down's choice, a check box
  and a radio button fill at once, Chinese fills as itself, Escape drops what was typed and gives
  the keyboard to the pages, letters and arrows typed in a field stay the field's, a read-only
  field takes nothing and says so, and an undo shows on the page and in the Fields panel at once.
  web/tests/hand/forms.mjs fills the hand fixture's form with the real pointer and keys.
