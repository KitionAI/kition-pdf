format: 1
id: regressions/issue-hand-c10-autoscroll
feature: pdf.editor.reading
intent: >-
  A text selection dragged to the bottom of the view stopped there: the pages did not scroll, so
  a selection could take only what was in view. Now a drag held near the top or bottom edge of
  the view (or past it) scrolls the pages, faster the nearer the edge, and the selection follows
  the text now under the pointer. web/tests/hand/reading.mjs holds a drag at the bottom edge and
  reads the view and the selected text back.
