format: 1
id: regressions/issue-hand-f3-bookmark-rename
feature: pdf.editor.bookmarks
intent: >-
  A bookmark could not be renamed or deleted in the panel (no double-click, no Delete, no menu),
  and the web engine did not even offer bookmark_rename and bookmark_delete: their `path`, a
  bookmark's place in the outline, was taken for a file. Now a double-click (or F2) writes the
  title in place, Enter keeps it as one bookmark_rename, Escape drops it, one undo brings the old
  title back; Delete deletes a bookmark. web/tests/hand/pages.mjs reads bookmark.list back, and
  bindings/wasm/tests/bookmark_tools.rs runs the four bookmark tools in the web engine.
