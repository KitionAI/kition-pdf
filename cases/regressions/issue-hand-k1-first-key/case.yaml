format: 1
id: regressions/issue-hand-k1-first-key
feature: pdf.editor.keyboard-and-view
intent: >-
  The keyboard works as soon as a PDF opens, before anything is clicked: the development host never
  gave the editor's frame the focus and the editor never took it, so PageDown and Cmd+F did nothing
  until a click on the pages. web/tests/hand/keys.mjs opens a synthetic PDF through the host's file
  input, presses PageDown and Cmd+F without a click, and reads the view and the find bar back.
