format: 1
id: regressions/issue-hand-e10-thumbnails-blank
feature: pdf.editor.repaint
intent: >-
  Every edit (a page turned, a comment added, a field filled) blanked every visible thumbnail and
  drew them all again one by one, about a second for six. Now the engine gives each page a stamp
  of what it draws, and an edit draws again only the thumbnails whose stamp changed, each keeping
  its old picture until the new one arrives; the page canvas never goes white meanwhile. Undo
  draws only the page it changes back. web/tests/hand/repaint.mjs counts the engine's thumbnail
  renders, watches every visible thumbnail each animation frame and screenshots the canvas.
layer: gate
dimension: function
source:
