feature: pdf.editor.params-and-fields
intent: >-
  Move pages refused pages typed as 3 (pages must be an array of integers) and closed its dialog,
  dropping what was typed. Now pages are typed as 3, 3, 5 or 2-4 and points as 300, 400; a value
  that is no list is refused at its field before anything runs, and a command that fails keeps the
  dialog open with everything typed and the error under the field it names.
  web/tests/hand/fields-panel.mjs moves pages by typing 3 and 6-8 and reads the page order back.
