format: 1
id: regressions/issue-hand-k2-focus-after-dialog
feature: pdf.editor.keyboard-and-view
intent: >-
  The keyboard stays the editor's after a parameters dialog ran or closed, after Enter in the form
  fields panel and after Enter in the page field: each left the focus on the page's body, so Cmd+Z,
  PageDown, Escape and Cmd+F did nothing until the pages were clicked (J2: two Cmd+Z after adding a
  comment left 6 comments). A key that still finds the body holding the keyboard goes to the pages.
  web/tests/hand/keys.mjs presses Cmd+Z and PageDown after each and reads the comments, the field and
  the view back.
