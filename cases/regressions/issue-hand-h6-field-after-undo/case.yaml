feature: pdf.editor.params-and-fields
intent: >-
  After an undo took a form field's value back, the form fields panel still showed the old text
  (the box was made once per field name). Now a box is made again when its value changes, and the
  panel draws a drop-down's options, a group of radio buttons, the field's label, type and whether
  it is required. web/tests/hand/fields-panel.mjs fills a field, presses Cmd+Z and reads the box.
