feature: pdf.collab.drafts
intent: >-
  The projection sync a merge needs joins the merge's undo step (data model 6.6, D9) instead of
  being a system change of its own: an agent's draft links page 1 to page 2, which the person
  deletes meanwhile, so the kit writes the merged link's Link object after the merge. One Undo
  gives back the exact state before the merge (state hash, comments, fields, links, pixels) and
  Redo the exact merged state.
