id: regressions/issue-hand-n8-fit-kept
feature: pdf.editor.keyboard-and-view
intent: >-
  A fit stays while the view changes size (R-A10): after Cmd+2 a narrower window still fits the page
  width, after Cmd+0 a shorter window still fits the page, and 100 % stays 100 %; any other zoom ends
  the fit. Before, the width fitted once and the page then overflowed a narrower window.
  web/tests/hand/first-ten-minutes.mjs (thing 8) resizes the browser's viewport and reads the zoom.
