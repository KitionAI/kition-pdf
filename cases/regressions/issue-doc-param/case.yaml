format: 1
id: regressions/issue-doc-param
feature: pdf.agent.recover
intent: >-
  Every command refuses a caller-supplied `doc` and says the document is the one the call is made
  on, like any other key its schema does not name, so a model that passes `doc` to pick another
  document is told instead of the edit landing on this one. Before, the binding replaced
  the given `doc` with its own and `page_rotate {degrees: 90, doc: "something-else"}` rotated the
  open document without an error.
layer: gate
source:
  kind: probe
  from: "parameter audit: `doc` accepted silently by PdfDocument::execute"
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: "kition-pdf-kit", test: "unknown_params", filter: "doc_parameter" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-17"
