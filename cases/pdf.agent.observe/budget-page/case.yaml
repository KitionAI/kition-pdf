format: 1
id: pdf.agent.observe/budget-page
feature: pdf.agent.observe
intent: >-
  The agent reads the pages through the kit to find which one is about the budget, and marks that page; pages are counted from 1, so the mark must land on page 2, not page 3.
layer: eval
source:
  kind: synthetic
  from: bindings/wasm/examples/ai_inputs.rs
  license: Apache-2.0
  note: "report.pdf written by bindings/wasm/examples/ai_inputs.rs: three pages headed Overview, Budget for 2026 and Appendix."
input: [input/report.pdf]
steps:
  - task:
      prompt: >-
        In report.pdf, find the page about the budget and add the word "Reviewed" somewhere on
        that page. Do not change the other pages.
      max_turns: 20
  - run: { path: report.pdf, args: { save: false }, steps: [{ command: text.extract }], as: text }
expected:
  - actual: out:text
    compare: values
    value:
      completed.0.result.pages.1.text: { contains: Reviewed }
  - actual: out:text
    compare: values
    collateral: true
    value:
      completed.0.result.pages: { count: 3 }
      completed.0.result.pages.0.text: "Overview\nSales rose in every region."
      completed.0.result.pages.2.text: "Appendix\nFigures are in thousands."
solution:
  - tool: pdf_run
    args: { path: report.pdf, steps: [{ command: page.addText, params: { page: 2, text: Reviewed, at: [72, 600] } }] }
since: "2026-11-17"
timeout_s: 600
