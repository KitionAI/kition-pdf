[package]
name = "kition-pdf-engine"
description = "Kition PDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true
# Builds on kdm-model, Kition's unpublished KDM bridge, so it cannot go to crates.io either.
publish = false

[lints]
workspace = true

[features]
# Counted ids for tests and sample builds (`KITION_REPRODUCIBLE_IDS`, see `Session::counted_ids`):
# enable it in `[dev-dependencies]` only, never in a shipped build, where two processes counting
# from one seed would mint the same ids.
reproducible-ids = []

[dependencies]
kition-pdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
kition-pdf-render = { workspace = true }
kition-pdf-cos = { workspace = true }
kition-pdf-organize = { workspace = true }
kition-pdf-annot = { workspace = true }
kition-pdf-forms = { workspace = true }
kition-pdf-xfa = { workspace = true }
kition-pdf-edit = { workspace = true }
kition-pdf-redact = { workspace = true }
kition-pdf-print = { workspace = true }
kition-pdf-xfdf = { workspace = true }
kition-pdf-sign = { workspace = true }
kition-pdf-optimize = { workspace = true }
kition-pdf-a11y = { workspace = true }
kition-pdf-ocr = { workspace = true }
kition-pdf-js = { workspace = true }
kition-pdf-compare = { workspace = true }
kition-pdf-preflight = { workspace = true }
kition-pdf-export = { workspace = true }
kition-pdf-fonts = { workspace = true }
kition-pdf-create = { workspace = true }
kition-pdf-model = { workspace = true }
kdm-model = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Already in the graph (kition-pdf-sign, kition-pdf-render): the random seed of new ids.
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The random seed of new ids; in the browser it comes from Web Crypto.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# The crate's own tests count ids when they ask for it (tests/random_ids.rs).
kition-pdf-engine = { path = ".", features = ["reproducible-ids"] }
