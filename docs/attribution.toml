[[build_input]]
name = "kition-fonts"
option = "KITION_FONTS_DIR"
title = "Japanese, Arabic and Telugu faces, when the checkout holds them (the public kition-fonts holds BIZ UDPGothic, BIZ UDMincho, Shippori Mincho and Noto Sans Arabic; Kition's builds don't set the variable, so they compile in none)"
author = "Each face's authors, as the checkout's ATTRIBUTION.md lists them"
source = "https://github.com/KitionAI/kition-fonts (a checkout next to this repository, or KITION_FONTS_DIR)"
licence = "OFL-1.1"
attribution = "https://github.com/KitionAI/kition-fonts/blob/main/ATTRIBUTION.md"
kind = "font"
usage = "crates/support/fonts/build.rs compiles in a checkout's Jpan, Arab and Telu faces (not its Chinese, Latin or emoji faces): Japanese fallback in the interface and Japanese glyphs in edited PDF text; Arabic and Telugu interface text; the web build only BIZ UDPGothic Regular and the Arab and Telu faces. It never embeds Source Han, Source Sans, Source Serif or Noto CJK (AGENTS.md §1.1). A build that compiles a face in must add its licence to NOTICE"

