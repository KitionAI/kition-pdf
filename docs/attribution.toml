# docs/attribution.toml: one entry per asset (AGENTS.md §1). The source of truth for provenance and licences.
# docs/attribution.md is generated from this file: `cargo xtask assets --write`. Checked by `cargo xtask assets` (part of `xtask ci`).
#
# [[asset]]    a file in this repository (committed or vendored); `sha256` must match the file.
# [[bundled]]  a file compiled into Kition PDF by a Cargo dependency (its crate version must match Cargo.lock).
# [[fetched]]  downloaded at build time by xtask (never committed), pinned by `sha256`.
# [[build_input]] an optional build input outside this repository (e.g. kition-fonts via KITION_FONTS_DIR);
#              never committed or downloaded here, its own repository attributes each file.
#
# licence: SPDX expression from the allowlist in AGENTS.md §1.2. adobe_data = true marks the closed list of
# Adobe-authored non-visual technical data allowed by AGENTS.md §1.1.

