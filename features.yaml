    gap: "Engine tests merge a draft, compare it first and restore a version. A draft merges with later edits of the document object by object (overlay key); a draft and a later edit that both rewrite one object (comments on one page, which both write the page) are refused, not merged, and so are two sides adding to one list (a page's annotations or the page tree is one overlay entry). A draft made before a full rewrite is refused, not merged. The person's undo of a full rewrite under an agent's later edit still drops that edit: the editor says so, it does not prevent it. The editor has no draft bar and no control to save a labelled version: the host compares, merges and records them (web/tests/drafts.mjs drives them through the development host)."
