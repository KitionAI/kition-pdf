    paths: [bindings/wasm/src/collab.rs, bindings/wasm/src/lib.rs, crates/engine/engine/src/kdm_bridge.rs, crates/kdm/kdm-model/src/session.rs, web/src/droppedEdits.ts, web/src/App.tsx, web/tests/drafts.mjs]
